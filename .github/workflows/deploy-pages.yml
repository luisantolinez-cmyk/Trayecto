name: Validate TRAYECTO static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify site files
        run: |
          test -f index.html
          test -f css/styles.css
          test -f js/main.js
          test -f 404.html
          grep -q "TRAYECTO" index.html
          grep -q "chapterNav" js/main.js
          echo "TRAYECTO static site structure verified."
